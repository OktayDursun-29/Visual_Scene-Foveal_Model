[project]
name = "foveal-scene"
version = "0.1.0"
description = "Simple 2D scene rendering with foveated image/object representations."
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.4.30",
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
research = [
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]
